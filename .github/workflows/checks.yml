name: Dashboard checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ops_dashboard_test
          POSTGRES_USER: ops_demo
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ops_demo -d ops_dashboard_test" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://ops_demo:test-only-password@127.0.0.1:5432/ops_dashboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run build
      - run: npm run format:check
